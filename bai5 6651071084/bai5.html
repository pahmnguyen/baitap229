<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopVN - Đăng ký tài khoản</title>
    <link rel="stylesheet" href="bai5.css">
</head>
<body>

    <main>
        <section class="form-card">
            <div class="form-header">
                <h1>Đăng ký tài khoản mới</h1>
                <p>Tạo tài khoản ShopVN để nhận nhiều ưu đãi hấp dẫn</p>
            </div>

            <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">
                
                <!-- Fieldset 1: Thông tin cơ bản -->
                <fieldset>
                    <legend>Thông tin cơ bản</legend>
                    
                    <div class="form-group">
                        <label for="hoten">Họ và tên <span class="required">*</span></label>
                        <input type="text" name="hoten" id="hoten" placeholder="Nguyễn Văn An" required maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="matkhau">Mật khẩu <span class="required">*</span></label>
                        <input type="password" name="matkhau" id="matkhau" minlength="8" placeholder="Tối thiểu 8 ký tự" required>
                    </div>

                    <div class="form-group">
                        <label for="sdt">Số điện thoại</label>
                        <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder="0901234567">
                    </div>
                </fieldset>

                <!-- Fieldset 2: Thông tin cá nhân -->
                <fieldset>
                    <legend>Thông tin cá nhân</legend>
                    
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="tuoi">Tuổi</label>
                            <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value="18">
                        </div>

                        <div class="form-group flex-1">
                            <label for="ngaysinh">Ngày sinh</label>
                            <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Giới tính</label>
                        <div class="radio-group">
                            <label class="custom-radio">
                                <input type="radio" name="gioitinh" value="nam">
                                <span class="radio-box">Nam</span>
                            </label>
                            <label class="custom-radio">
                                <input type="radio" name="gioitinh" value="nu">
                                <span class="radio-box">Nữ</span>
                            </label>
                            <label class="custom-radio">
                                <input type="radio" name="gioitinh" value="khac">
                                <span class="radio-box">Khác</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="mauua">Màu yêu thích</label>
                        <div class="color-picker-wrapper">
                            <input type="color" name="mauua" id="mauua" value="#FF6B6B">
                            <span class="color-text">Nhấp để chọn màu</span>
                        </div>
                    </div>
                </fieldset>

                <!-- Fieldset 3: Sở thích & Cài đặt -->
                <fieldset>
                    <legend>Sở thích & Cài đặt</legend>
                    
                    <div class="form-group">
                        <label for="soikim">Tìm kiếm sở thích</label>
                        <input type="search" name="soikim" id="soikim" placeholder="Ví dụ: đọc sách, chơi game...">
                    </div>

                    <div class="form-group">
                        <label for="chitieu">Mức chi tiêu/tháng (VNĐ)</label>
                        <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000">
                    </div>

                    <div class="form-group">
                        <label>Sở thích (chọn nhiều)</label>
                        <div class="checkbox-group">
                            <label class="custom-checkbox">
                                <input type="checkbox" name="st_docsach" value="doc">
                                <span>Đọc sách</span>
                            </label>
                            <label class="custom-checkbox">
                                <input type="checkbox" name="st_game" value="game">
                                <span>Chơi game</span>
                            </label>
                            <label class="custom-checkbox">
                                <input type="checkbox" name="st_du_lich" value="dulich">
                                <span>Du lịch</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="website">Website cá nhân</label>
                        <input type="url" name="website" id="website" placeholder="https://example.com">
                    </div>

                    <div class="form-group">
                        <label for="avatar">Ảnh đại diện</label>
                        <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg" class="file-input">
                    </div>
                </fieldset>

                <!-- Nút bấm -->
                <div class="form-buttons">
                    <input type="submit" value="Đăng ký ngay" class="btn btn-primary">
                    <input type="reset" value="Nhập lại" class="btn btn-secondary">
                </div>

            </form>
        </section>
    </main>

</body>
</html>
